[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify serves public/ straight from its CDN and does not apply the headers()
# in next.config.mjs to those files. Generated assets are content-stable (a URL
# always names the same bytes; regenerating one means renaming it), so let
# browsers keep them for a year instead of revalidating forty-odd files a visit.
[[headers]]
  for = "/assets/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
